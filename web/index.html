<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7eeee" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS "Add to Home Screen": runs as its own full-screen app with this icon and name. Status bar style "default"
         keeps the clock readable in light and dark (black-translucent would force white text over light themes);
         the safe-area CSS still keeps content clear of the home indicator and landscape notch. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Recall" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Recall</title>
    <script>
      // apply saved theme + colour before first paint (no flash, and works on pages without the sidebar)
      try {
        var t = localStorage.getItem('recall-theme'), a = localStorage.getItem('recall-accent');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (a && /^[a-z]+$/.test(a)) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
