    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Recall</title>
    <script>
      // apply saved theme before first paint (no flash, and works on pages without the sidebar)
      try { var t = localStorage.getItem('recall-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
