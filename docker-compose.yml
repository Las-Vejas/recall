# Recall: run `docker compose up -d`, then open the claim link from `docker compose logs` to create the first (admin) account.
# Data is stored in the Docker volume "recall-data" (the same one ./recall.sh uses) and survives restarts, rebuilds and updates.
# Nothing needs editing. To change settings, copy .env.example to .env.
services:
  recall:
    build: .
    image: recall:latest
    container_name: recall
    restart: unless-stopped
    ports:
      - "${RECALL_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}             # optional: your Postgres, e.g. postgres://user:pass@host:5432/recall
      TZ: ${TZ:-UTC}                              # sets when "today" starts for daily new-card limits
      PUBLIC_URL: ${PUBLIC_URL:-}                 # your address, e.g. https://recall.example.com (needed for passkeys + providers)
      TRUST_PROXY: ${TRUST_PROXY:-}               # optional: "1" when behind one reverse proxy (Caddy, nginx, Traefik)
      DESIRED_RETENTION: ${DESIRED_RETENTION:-0.9}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}       # optional: xoxb- bot token for study reminders in Slack
    volumes:
      - recall-data:/data   # permanent storage for the built-in SQLite database (unused with DATABASE_URL)

volumes:
  recall-data:
    name: recall-data       # fixed name, so it's the same volume whatever folder you run this from
